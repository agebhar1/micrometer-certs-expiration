---
name: CI
permissions: {}

on: [ push ]

env:
  MAVEN_ARGS: --show-version --no-transfer-progress

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        javaVersion: [ 11, 17, 21, 25 ]
        javaDistribution: [ "temurin", "zulu" ]
    name: Java ${{ matrix.javaVersion }}-${{ matrix.javaDistribution }}
    steps:
      - uses: actions/checkout@v6
      - name: Install SDKMAN!
        run: |
          curl -s "https://get.sdkman.io?ci=true" | bash
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk version
      - name: Setup Maven
        run: |
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install maven 3.9.16
      - uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.javaDistribution }}
          java-version: ${{ matrix.javaVersion }}
          cache: 'maven'
      - name: Verify with Maven
        if: ${{ matrix.javaVersion >= 25 }}
        run: |
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          mvn verify -Drevision=0.1.0 -Dchangelist=-SNAPSHOT
      - name: Verify with Maven
        if: ${{ matrix.javaVersion >= 17 && matrix.javaVersion < 25 }}
        run: |
          sed --in-place '/micronaut5/d' samples/pom.xml
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          mvn verify -Drevision=0.1.0 -Dchangelist=-SNAPSHOT  # --projects -:micrometer-certs-expiration-samples-micronaut5 fails on GitHub
      - name: Verify with Maven
        if: ${{ matrix.javaVersion < 17 }}
        run: |
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          mvn verify -Drevision=0.1.0 -Dchangelist=-SNAPSHOT --projects -:micrometer-certs-expiration-samples-spring-boot3,-:micrometer-certs-expiration-samples-spring-boot4,-:micrometer-certs-expiration-samples-micronaut4,-:micrometer-certs-expiration-samples-micronaut5,-:micrometer-certs-expiration-samples-quarkus3
